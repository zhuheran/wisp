[package]
name = "wisp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "wisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
wisp-common.workspace = true
wisp-keyring.workspace = true
wisp-db.workspace = true
wisp-configs.workspace = true
wisp-llm.workspace = true
wisp-mcp.workspace = true
wisp-tool-registry.workspace = true
wisp-software-tools.workspace = true
wisp-conversation.workspace = true
wisp-skills.workspace = true

tauri = { version = "2.11", features = ["macos-private-api", "test"] }
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util.workspace = true
rusqlite = { version = "0.35.0", features = ["bundled"] }
window-vibrancy = "0.6.0"
uuid = "1.24.0"
reqwest = { version = "0.13", features = ["stream", "json"] }
image = "0.25"
base64 = "0.22"
anyhow = "1"
async-trait.workspace = true
schemars = "1"

