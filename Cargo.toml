[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
wisp-common = { path = "crates/wisp-common" }
wisp-keyring = { path = "crates/wisp-keyring" }
wisp-db = { path = "crates/wisp-db" }
wisp-configs = { path = "crates/wisp-configs" }
wisp-llm = { path = "crates/wisp-llm" }
wisp-mcp = { path = "crates/wisp-mcp" }
wisp-tool-registry = { path = "crates/wisp-tool-registry" }
wisp-software-tools = { path = "crates/wisp-software-tools" }
wisp-conversation = { path = "crates/wisp-conversation" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4"] }
tauri = { version = "2.11", features = ["macos-private-api"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
reqwest-sse = "0.2"
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
